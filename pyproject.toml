[project]
name = "ai-illust-cleaner"
version = "0.1.0"
description = "AI生成イラストのメタデータ確認・消去と、塗り面ノイズの可視化・除去を行うツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.8",
    "numpy",
    "pillow",
    "scipy",
    "matplotlib",
    "scikit-image",
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
